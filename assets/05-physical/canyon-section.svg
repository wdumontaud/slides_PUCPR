<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 570" font-family="CMU Sans Serif, Arial, sans-serif">
    <!-- Slide 8, step 2: vertical section of the street canyon (studied wall, front building, sun). Keep the transparent frame: it fixes the size of the drawing. -->
  <defs>
      <pattern id="canyon-section-hat" width="10" height="10" patternUnits="userSpaceOnUse" patternTransform="rotate(45)"><rect width="10" height="10" fill="#9aa3ad"/><line x1="0" y1="0" x2="0" y2="10" stroke="#8a929c" stroke-width="3"/></pattern>
      <linearGradient id="canyon-section-fb" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#5b6572"/><stop offset="1" stop-color="#8d97a3"/></linearGradient>
      <marker id="canyon-section-k" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#222"/></marker>
      <marker id="canyon-section-s" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#e0a800"/></marker>
    </defs>
    <rect x="0" y="0" width="880" height="570" fill="none"/>
  <!-- sky tint, ground -->
  <rect x="90" y="0" width="790" height="500" fill="#e8f1fa"/>
  <rect x="0" y="500" width="880" height="70" fill="#c8b48f"/>
  <!-- shadow of the front building on the street and on the lower part of the wall -->
  <polygon points="300,347 600,200 600,500 300,500" fill="#1d2733" opacity=".14"/>
  <!-- studied building: room (inside), slabs, wall = insulation (inside) + structure (outside) -->
  <rect x="90" y="120" width="110" height="380" fill="#f6ecdc"/>
  <rect x="200" y="120" width="40" height="380" fill="#f2d65c" stroke="#444"/>
  <rect x="240" y="120" width="60" height="380" fill="url(#canyon-section-hat)" stroke="#444"/>
  <rect x="90" y="120" width="110" height="12" fill="#bfc6ce" stroke="#444"/>
  <rect x="90" y="488" width="110" height="12" fill="#bfc6ce" stroke="#444"/>
  <!-- the sunlit part of the outside face (above the shadow limit) -->
  <line x1="300" y1="120" x2="300" y2="347" stroke="#e0a800" stroke-width="7"/>
  <rect x="198" y="118" width="104" height="384" fill="none" stroke="#d1201f" stroke-width="3.5"/>
  <!-- front building -->
  <rect x="600" y="200" width="180" height="300" fill="url(#canyon-section-fb)" stroke="#444"/>
  <g fill="#b8c7d6"><rect x="630" y="235" width="34" height="34"/><rect x="716" y="235" width="34" height="34"/><rect x="630" y="305" width="34" height="34"/><rect x="716" y="305" width="34" height="34"/><rect x="630" y="375" width="34" height="34"/><rect x="716" y="375" width="34" height="34"/></g>
  <!-- sun rays and shadow limit -->
  <g stroke="#e0a800" stroke-width="3.2" marker-end="url(#canyon-section-s)">
    <line x1="575" y1="15" x2="298" y2="150"/><line x1="708" y1="15" x2="298" y2="215"/><line x1="840" y1="15" x2="298" y2="280"/></g>
  <line x1="700" y1="151" x2="300" y2="347" stroke="#555" stroke-width="2" stroke-dasharray="7 5"/>
  <circle cx="842" cy="52" r="18" fill="#f6c200" stroke="#c99700" stroke-width="2"/>
  <!-- dimensions: H, L, DX, DY -->
  <g stroke="#222" stroke-width="2" fill="none" marker-start="url(#canyon-section-k)" marker-end="url(#canyon-section-k)">
    <line x1="62" y1="120" x2="62" y2="500"/>
    <line x1="200" y1="538" x2="300" y2="538"/>
    <line x1="302" y1="470" x2="598" y2="470"/>
    <line x1="818" y1="200" x2="818" y2="500"/>
  </g>
  <g font-size="26" font-style="italic" fill="#111"><text x="30" y="318">H</text><text x="242" y="560">L</text><text x="438" y="458">ΔX</text><text x="832" y="356">ΔY</text></g>
  <!-- labels -->
  <g font-size="21">
    <text x="150" y="82" text-anchor="middle" fill="#b02020" font-weight="700">studied wall</text>
    <text x="130" y="320" text-anchor="middle" fill="#c0392b">inside</text>
    <text x="330" y="82" fill="#1f5c99">outside</text>
    <text x="318" y="294" fill="#b38600" font-weight="700">sunlit</text>
    <text x="318" y="425" fill="#333" font-weight="700">shadow</text>
    <text x="760" y="188" text-anchor="middle" fill="#333">front building</text>
    <text x="840" y="92" text-anchor="middle" fill="#8a6a00">sun</text>
    <text x="0" y="0" fill="#555" font-size="17" text-anchor="middle" transform="translate(498 232) rotate(-26)">shadow limit</text>
    <text x="30" y="545" fill="#7a4b1d">soil</text>
  </g>
</svg>
