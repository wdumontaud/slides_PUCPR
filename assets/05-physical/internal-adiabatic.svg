    <!-- adiabatic top and bottom of the wall -->
    <g>
      <path d="M80,170 L150,70 L162,78 L92,178 Z" fill="url(#internal-adiabatic-ph-adia)" stroke="#6b8aa5"/>
      <path d="M80,500 L150,400 L162,408 L92,508 Z" fill="url(#internal-adiabatic-ph-adia)" stroke="#6b8aa5"/>
      <text x="30" y="88" font-size="19" fill="#4b6a85" font-style="italic">Γ<tspan font-size="13" dy="6">4</tspan><tspan dy="-6"> adiabatic</tspan></text>
      <text x="170" y="530" font-size="19" fill="#4b6a85" font-style="italic">Γ<tspan font-size="13" dy="6">2</tspan><tspan dy="-6"> adiabatic</tspan></text>
    </g>
    <line x1="40" y1="500" x2="40" y2="400" stroke="#222" stroke-width="1.8" marker-end="url(#internal-adiabatic-ph-kk)"/><text x="48" y="410" font-size="19" font-style="italic">y</text>
  </svg>
