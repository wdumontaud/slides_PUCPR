<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 560" font-family="CMU Sans Serif, Arial, sans-serif">
    <!-- Slide 10: the wall is the one of slide 9 (same place), the boundary condition is drawn at its left; the drawing overflows to the left of the frame (the slide sets overflow: visible). Keep the transparent frame. -->
