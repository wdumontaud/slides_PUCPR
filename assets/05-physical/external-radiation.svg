<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 480 560" font-family="CMU Sans Serif, Arial, sans-serif">
    <!-- Slide 10, step 1: wind profile and radiation. Layers of this slide are stacked in parts/05-physical.html. Keep the transparent frame: it fixes the size of the drawing. -->
  <defs>
      <pattern id="external-radiation-ph-hat2" width="10" height="10" patternUnits="userSpaceOnUse" patternTransform="rotate(45)"><rect width="10" height="10" fill="#9aa3ad"/><line x1="0" y1="0" x2="0" y2="10" stroke="#8a929c" stroke-width="3"/></pattern>
      <marker id="external-radiation-ph-w" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#2a7fb8"/></marker>
      <marker id="external-radiation-ph-s" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#e0a800"/></marker>
      <marker id="external-radiation-ph-l" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#d1495b"/></marker>
      <marker id="external-radiation-ph-k" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#222"/></marker>
    </defs>
    <rect x="0" y="0" width="480" height="560" fill="none"/>
  <rect x="0" y="500" width="480" height="60" fill="#c8b48f"/>
    <!-- wall: outside face Γ1 on the left -->
    <path d="M300,40 C282,140 318,230 296,320 C282,390 306,450 300,500 L400,500 L400,40 Z" fill="url(#external-radiation-ph-hat2)" stroke="#444"/>
    <rect x="400" y="40" width="40" height="460" fill="#f2d65c" stroke="#444"/>
    <path d="M300,40 C282,140 318,230 296,320 C282,390 306,450 300,500" fill="none" stroke="#4D0DAB" stroke-width="5"/>
    <text x="318" y="250" font-size="26" font-style="italic" fill="#4D0DAB">Γ<tspan font-size="17" dy="7">1</tspan></text>
    <!-- wind profile (power law) -->
    <g>
      <path d="M30,500 C33,420 60,300 80,40" fill="none" stroke="#2a7fb8" stroke-width="2" stroke-dasharray="5 4"/>
      <g stroke="#2a7fb8" stroke-width="3" marker-end="url(#external-radiation-ph-w)">
        <line x1="30" y1="470" x2="72" y2="470"/><line x1="30" y1="400" x2="120" y2="400"/><line x1="30" y1="320" x2="160" y2="320"/>
        <line x1="30" y1="240" x2="190" y2="240"/><line x1="30" y1="160" x2="214" y2="160"/><line x1="30" y1="80" x2="234" y2="80"/></g>
      <line x1="30" y1="510" x2="30" y2="30" stroke="#222" stroke-width="1.8" marker-end="url(#external-radiation-ph-k)"/>
      <text x="40" y="36" font-size="20" font-style="italic">y</text>
      <text x="120" y="440" font-size="21" fill="#2a7fb8" font-style="italic">v(y) ∝ y<tspan font-size="14" dy="-9">β</tspan></text>
    </g>
    <!-- radiation -->
    <g>
      <g stroke="#e0a800" stroke-width="3.2" marker-end="url(#external-radiation-ph-s)"><line x1="150" y1="20" x2="282" y2="110"/><line x1="140" y1="90" x2="294" y2="200"/></g>
      <text x="96" y="20" font-size="21" font-weight="700" fill="#b38600" font-style="italic">q<tspan font-size="14" dy="5">sw</tspan></text>
      <path d="M296,360 q-12,-14 -24,0 t-24,0 t-24,0 t-24,0 t-24,0" fill="none" stroke="#d1495b" stroke-width="3" marker-end="url(#external-radiation-ph-l)"/>
      <path d="M150,300 q12,-14 24,0 t24,0 t24,0 t24,0 t24,0" fill="none" stroke="#d1495b" stroke-width="3" marker-end="url(#external-radiation-ph-l)"/>
      <text x="156" y="392" font-size="21" font-weight="700" fill="#d1495b" font-style="italic">q<tspan font-size="14" dy="5">ℓw</tspan></text>
    </g>
    <text x="40" y="545" font-size="19" fill="#1f5c99">outside</text><text x="404" y="545" font-size="19" fill="#c0392b">inside</text>
  </svg>
