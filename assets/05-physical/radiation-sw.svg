<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 470" width="600" height="470" font-family="CMU Sans Serif, Arial, sans-serif">
<!-- placeholder: replace this file with your own illustration (same name) -->
<defs>
 <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#cfe4f7"/><stop offset="1" stop-color="#f4f9fe"/></linearGradient>
 <linearGradient id="fb" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#5b6470"/><stop offset="1" stop-color="#8d96a1"/></linearGradient>
 <marker id="ay" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#e0a800"/></marker>
 <marker id="ab" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#3b82c4"/></marker>
 <marker id="ag" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#9b7b4a"/></marker>
 <marker id="ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#d1495b"/></marker>
 <pattern id="soil" width="12" height="12" patternUnits="userSpaceOnUse"><rect width="12" height="12" fill="#b9a27d"/><path d="M0,12 L12,0" stroke="#a48c66" stroke-width="2"/></pattern>
</defs>
<rect width="600" height="470" fill="url(#sky)"/>
<rect x="0" y="420" width="600" height="50" fill="url(#soil)"/>
<!-- front building -->
<rect x="40" y="150" width="130" height="270" fill="url(#fb)"/>
<g fill="#c9d6e3" opacity=".8"><rect x="62" y="180" width="26" height="34"/><rect x="118" y="180" width="26" height="34"/><rect x="62" y="250" width="26" height="34"/><rect x="118" y="250" width="26" height="34"/><rect x="62" y="320" width="26" height="34"/><rect x="118" y="320" width="26" height="34"/></g>
<text x="105" y="140" text-anchor="middle" font-size="17" fill="#333">front building</text>
<!-- studied wall: structural (grey) with curved outside face, insulation (yellow), room -->
<rect x="490" y="100" width="110" height="320" fill="#f6efe0"/>
<text x="545" y="270" text-anchor="middle" font-size="17" fill="#c0392b">inside</text>
<path d="M452,100 C436,160 470,220 446,290 C432,340 456,390 448,420 L476,420 L476,100 Z" fill="#9aa3ad" stroke="#555" stroke-width="1.2"/>
<rect x="476" y="100" width="14" height="320" fill="#f2d65c" stroke="#555" stroke-width="1.2"/>
<text x="466" y="88" text-anchor="middle" font-size="16" fill="#333">studied wall</text>
<!-- shadow cast by the front building -->
<path d="M170,150 L446,293 L448,420 L170,420 Z" fill="#1d2733" opacity=".22"/>
<!-- sun -->
<g transform="translate(40,70)"><circle r="20" fill="#ffd34d"/><g stroke="#ffc400" stroke-width="3">
<line x1="0" y1="-30" x2="0" y2="-38"/><line x1="0" y1="30" x2="0" y2="38"/><line x1="-30" y1="0" x2="-38" y2="0"/><line x1="30" y1="0" x2="38" y2="0"/>
<line x1="21" y1="21" x2="27" y2="27"/><line x1="-21" y1="-21" x2="-27" y2="-27"/><line x1="21" y1="-21" x2="27" y2="-27"/><line x1="-21" y1="21" x2="-27" y2="27"/></g></g>
<!-- direct -->
<g stroke="#e0a800" stroke-width="3" marker-end="url(#ay)">
<line x1="190" y1="0" x2="447" y2="133"/><line x1="200" y1="56" x2="455" y2="188"/><line x1="200" y1="108" x2="452" y2="238"/><line x1="230" y1="160" x2="440" y2="270"/></g>
<text x="92" y="30" font-size="19" font-weight="700" fill="#b38600">direct</text>
<!-- diffuse -->
<g stroke="#3b82c4" stroke-width="2.4" stroke-dasharray="6 4" marker-end="url(#ab)">
<line x1="330" y1="40" x2="438" y2="120"/><line x1="360" y1="20" x2="452" y2="160"/><line x1="380" y1="60" x2="440" y2="330"/><line x1="300" y1="250" x2="438" y2="370"/></g>
<text x="490" y="50" font-size="19" font-weight="700" fill="#3b82c4">diffuse</text>
<!-- reflected -->
<g stroke="#9b7b4a" stroke-width="2.4" marker-end="url(#ag)">
<path d="M260,420 L440,395" fill="none"/><path d="M330,420 L444,345" fill="none"/><path d="M175,300 L438,310" fill="none"/></g>
<text x="210" y="452" font-size="19" font-weight="700" fill="#7a5c2e">reflected (ground, buildings)</text>
<text x="380" y="210" text-anchor="end" font-size="17" fill="#b38600" font-weight="700" transform="translate(0,0)">sunlit</text>
<text x="420" y="380" text-anchor="end" font-size="17" fill="#1d2733" font-weight="700">shadow</text>
</svg>
