<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 570" font-family="CMU Sans Serif, Arial, sans-serif">
    <!-- Slide 12, step 0: convection with the corners. Layers of this slide are stacked in parts/05-physical.html. Keep the transparent frame: it fixes the size of the drawing. -->
  <defs>
      <pattern id="internal-convection-ph-hat3" width="10" height="10" patternUnits="userSpaceOnUse" patternTransform="rotate(45)"><rect width="10" height="10" fill="#9aa3ad"/><line x1="0" y1="0" x2="0" y2="10" stroke="#8a929c" stroke-width="3"/></pattern>
      <pattern id="internal-convection-ph-adia" width="9" height="9" patternUnits="userSpaceOnUse" patternTransform="rotate(-45)"><rect width="9" height="9" fill="#fff"/><line x1="0" y1="0" x2="0" y2="9" stroke="#6b8aa5" stroke-width="3"/></pattern>
      <linearGradient id="internal-convection-ph-air" x1="0" y1="1" x2="0" y2="0"><stop offset="0" stop-color="#fde3d6"/><stop offset="1" stop-color="#fff5ee"/></linearGradient>
      <marker id="internal-convection-ph-c" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#2a7fb8"/></marker>
      <marker id="internal-convection-ph-lr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#d1495b"/></marker>
      <marker id="internal-convection-ph-kk" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#222"/></marker>
    </defs>
    <rect x="0" y="0" width="560" height="570" fill="none"/>
  <!-- thermal zone: parallelepiped (oblique view), the studied wall is its left face -->
    <!-- back faces -->
    <path d="M150,70 L470,70 L470,400 L150,400 Z" fill="url(#internal-convection-ph-air)" stroke="#999" stroke-width="1.5"/>
    <path d="M150,400 L470,400 L400,500 L80,500 Z" fill="#efe3d3" stroke="#999" stroke-width="1.5"/>
    <path d="M470,70 L470,400 L400,500 L400,170 Z" fill="#f7e9de" stroke="#999" stroke-width="1.5"/>
    <!-- studied wall (left face), with its two layers -->
    <path d="M80,170 L150,70 L150,400 L80,500 Z" fill="url(#internal-convection-ph-hat3)" stroke="#444"/>
    <path d="M100,142 L150,70 L150,400 L100,472 Z" fill="#f2d65c" opacity=".95" stroke="#444"/>
    <path d="M114,122 L150,70 L150,400 L114,452 Z" fill="none"/>
    <!-- ceiling outline (open) -->
    <path d="M80,170 L150,70 L470,70 L400,170 Z" fill="none" stroke="#bbb" stroke-dasharray="6 5"/>
    <path d="M80,170 L400,170 L400,500" fill="none" stroke="#bbb" stroke-dasharray="6 5"/>
    <text x="300" y="270" text-anchor="middle" font-size="24" fill="#c0392b">thermal zone</text>
    <text x="300" y="300" text-anchor="middle" font-size="21" font-style="italic" fill="#c0392b">air at T<tspan font-size="14" dy="6">∞,3</tspan></text>
    <text x="30" y="560" font-size="18" fill="#444">studied wall (inside face Γ₃)</text>
    <!-- convection profile along the inside face (corner model: lower near the corners) -->
    <g>
      <path d="M150,400 C210,330 210,140 150,70" fill="none" stroke="#2a7fb8" stroke-width="2" stroke-dasharray="5 4"/>
      <g stroke="#2a7fb8" stroke-width="3" marker-end="url(#internal-convection-ph-c)">
        <line x1="157" y1="370" x2="182" y2="370"/><line x1="157" y1="310" x2="196" y2="310"/><line x1="157" y1="235" x2="201" y2="235"/>
        <line x1="157" y1="160" x2="196" y2="160"/><line x1="157" y1="100" x2="180" y2="100"/></g>
      <text x="206" y="200" font-size="20" font-style="italic" fill="#2a7fb8">h<tspan font-size="13" dy="6">∞,3</tspan><tspan dy="-6">(y)</tspan></text>
    </g>
    <line x1="40" y1="500" x2="40" y2="400" stroke="#222" stroke-width="1.8" marker-end="url(#internal-convection-ph-kk)"/><text x="48" y="410" font-size="19" font-style="italic">y</text>
  </svg>
