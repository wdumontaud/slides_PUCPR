<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 480 560" font-family="CMU Sans Serif, Arial, sans-serif">
    <!-- Slide 10, step 0: wind profile only. Layers of this slide are stacked in parts/05-physical.html. Keep the transparent frame: it fixes the size of the drawing. -->
