<!-- Table of contents: generated automatically (one card per section) from the section / subsection comments of all parts -->
<style>
.s-toc .cards{position:absolute;left:0;right:0;top:40px;display:flex;gap:22px;align-items:stretch}
.s-toc .card{flex:1;position:relative;background:rgba(255,255,255,.93);border-radius:12px;padding:20px 20px 16px;
  box-shadow:0 4px 18px rgba(0,41,75,.16);border-top:7px solid var(--blueCNRS);overflow:hidden;min-height:400px}
.s-toc .card:nth-child(1){border-top-color:#6b8aa5}
.s-toc .card:nth-child(2){border-top-color:var(--blueCNRS)}
.s-toc .card:nth-child(3){border-top-color:var(--purple)}
.s-toc .card:nth-child(4){border-top-color:#c9a800}
.s-toc .num{position:absolute;right:16px;top:6px;font-size:58px;font-weight:700;color:#e4e8ef;line-height:1}
.s-toc .ico{height:92px;margin:4px 0 10px}
.s-toc .ico svg{height:92px;width:auto}
.s-toc .name{font-size:27px;font-weight:700;color:var(--blueCNRS);line-height:1.15;min-height:62px}
.s-toc .card ul{list-style:none;padding:0;margin:14px 0 0;font-size:19px;color:#333}
.s-toc .card li{margin:.45em 0;padding-left:16px;position:relative}
.s-toc .card li::before{content:"";position:absolute;left:0;top:.5em;width:7px;height:7px;border-radius:50%;background:var(--purple)}
/* entrance: cards rise one after the other each time the slide is shown */
@keyframes toc-rise{from{opacity:0;transform:translateY(40px)}to{opacity:1;transform:none}}
.s-toc.active .card{animation:toc-rise .7s cubic-bezier(.2,.8,.2,1) both;animation-delay:calc(var(--k)*.18s + .1s)}
.noanim .card{animation:none!important}
</style>
<section class="slide" data-title="Outline" data-auto="toc" data-toc-style="cards">
