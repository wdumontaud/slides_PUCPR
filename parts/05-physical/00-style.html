<!-- section: Physical problem -->
<!-- shared by the slides of this section: equation cards, stacked layers. The CSS of each slide is in its own file. -->
<style>
/* ---- shared: numbered equations, set like a LaTeX document (math rendered by KaTeX at build time, see math_render.py) ---- */
.ph .content>*{position:absolute}  /* content box: 1192 x 572 px */
.ph .eqs{display:flex;flex-direction:column;gap:34px}
.ph .eq{position:relative;font-size:20px;line-height:1.5;color:#2b3440;transition:opacity .5s,transform .5s}
.ph .eq.step-hidden{transform:translateY(14px)}
.ph .eq .intro{margin:0;max-width:94%}
.ph .eq .intro b{color:var(--c,var(--blueCNRS));font-weight:700}
.ph .eq .katex-display{position:relative;margin:.6em 0 0;padding-right:48px;font-size:1.08em}
.ph .eq .katex-display::after{content:"(" attr(data-n) ")";position:absolute;right:0;top:50%;transform:translateY(-50%);font:19px/1 "KaTeX_Main",serif;color:#444}
.ph .eq.past{opacity:.45}
.ph .cOm{--c:var(--blueCNRS)} .ph .cGj{--c:var(--purple)} .ph .cGi{--c:#d1495b} .ph .cIc{--c:#6b8aa5}
.ph .cConv{--c:#2a7fb8} .ph .cRad{--c:#d48a00} .ph .cLw{--c:#d1495b} .ph .cAd{--c:#6b8aa5}
.ph .src{font-size:15px;color:#666}
.ph figure{margin:0}
.ph figcaption{font-size:16px;color:#555;text-align:center;margin-top:6px}
/* drawings that change with the steps: one full picture per step, stacked; each step shows one of them (data-from / data-until) */
.ph .layers>*{position:absolute;inset:0;width:100%;height:100%}
</style>
<script>
/* equation numbers (1), (2), ... in the order of the talk, like \begin{equation} */
document.addEventListener("DOMContentLoaded",()=>document.querySelectorAll(".ph .eq .katex-display").forEach((e,i)=>e.dataset.n=i+1));
</script>
