<!-- ================================================================ 1. urban scene -> street -> section -> deformed wall -->
<!-- Steps: 0 the city (video) | 1 the studied buildings (capture) | 2 the street, labelled | 3 the vertical section opens the studied building (wall at its real thickness)
            | 4 the wall is inflated: thickness exaggerated, dimensions | 5 full notation of the deformed wall.
     The wall (city-wall-shapes.svg + city-wall-notes.svg) is the figure of slide 9, at the same place (page 820,94, 416 x 582): it does not move afterwards. -->
<style>
.city .vid{left:96px;top:0;width:1000px;height:562px;border-radius:12px;overflow:hidden;box-shadow:0 8px 30px rgba(0,41,75,.3)}
.city .vid video,.city .vid img{width:100%;height:100%;object-fit:cover;display:block}
.city .tag{position:absolute;right:14px;bottom:12px;background:rgba(0,41,75,.85);color:#fff;font-size:18px;padding:4px 12px;border-radius:6px}
/* the street: full width of the slide (1236 px from the left margin to the slide edge) */
.city .st{left:0;top:0;width:1236px;height:572px;overflow:hidden}
.city .st img{position:absolute;left:0;top:0;width:1236px;height:572px;display:block}
.city .st .cutL{clip-path:inset(0 344px 0 736px);opacity:0;transition:opacity .8s}
.city .st .cutB{clip-path:inset(0 344px 0 892px);transition:clip-path 1.8s cubic-bezier(.45,0,.25,1)}
.city[data-step="3"] .st .cutL,.city[data-step="4"] .st .cutL,.city[data-step="5"] .st .cutL{opacity:1}
.city[data-step="3"] .st .cutB,.city[data-step="4"] .st .cutB,.city[data-step="5"] .st .cutB{clip-path:inset(0 0 0 892px)}
/* the section plane sweeps from the corner of the building to the right edge, then disappears */
.city .st .pl{position:absolute;left:884px;top:0;width:16px;height:572px;opacity:0;pointer-events:none}
.city .st .pl i{position:absolute;inset:0;background:rgba(255,159,28,.30)}
.city .st .pl u{position:absolute;left:7px;top:0;bottom:0;border-left:2px dashed #b45f00}
.city .st .pl b{position:absolute;right:22px;top:250px;background:#c77700;color:#fff;font-size:18px;font-weight:400;padding:2px 10px;border-radius:6px;white-space:nowrap}
.city[data-step="3"] .st .pl{animation:city-plane 2.4s ease-in-out forwards}
@keyframes city-plane{0%{opacity:0;transform:translateX(0)}12%{opacity:1;transform:translateX(0)}88%{opacity:1;transform:translateX(344px)}100%{opacity:0;transform:translateX(344px)}}
/* pills */
.city .lb{position:absolute;color:#fff;font-size:21px;padding:3px 12px;border-radius:6px;white-space:nowrap;background:rgba(0,41,75,.88);transition:opacity .5s,visibility .5s}
.city .lb.s{font-size:18px;padding:2px 10px}
.city[data-step="3"] .lb.ctx,.city[data-step="4"] .lb.ctx,.city[data-step="5"] .lb.ctx{opacity:.6}
.city .lb.pu{background:#4D0DAB} .city .lb.bl{background:#1f5c99;font-size:19.8px} .city .lb.rd{background:#c0392b;font-size:19.8px}
/* the wall: section at its real thickness, then inflated into the deformed wall */
.city .wb{left:776px;top:-6px;width:416px;height:582px}
.city .wb svg{width:100%;height:100%;display:block;overflow:visible}
.city .wsh{clip-path:inset(0 100% 0 0);transition:clip-path .8s ease .3s}
.city[data-step="3"] .wsh,.city[data-step="4"] .wsh,.city[data-step="5"] .wsh{clip-path:inset(0 0 0 0)}
.city .wsi{width:100%;height:100%;transform-origin:116.5px 0;transform:scaleX(.153);transition:transform 1.3s cubic-bezier(.4,0,.2,1)}
.city[data-step="4"] .wsi,.city[data-step="5"] .wsi{transform:scaleX(1)}
.city .shd{left:893px;top:56px;width:194px;height:22px;background:linear-gradient(rgba(0,0,0,.30),rgba(0,0,0,0));opacity:0;transition:opacity .8s}
.city[data-step="4"] .shd,.city[data-step="5"] .shd{opacity:1}
/* notation of the wall: ONE drawing (city-wall-notes.svg, exported from PowerPoint as it is), shown as a whole from step 4.
   Its frame is the bounding box of the PowerPoint objects: same scale as the wall (582 px high), 30.4 px wider on the left, 459 px wide */
.city .nt{left:745.6px;width:459px;opacity:0;transition:opacity .6s}
.city[data-step="4"] .nt,.city[data-step="5"] .nt{opacity:1}
.city .note{left:1102px;top:532px;width:130px;font-size:15px;line-height:1.15;font-style:italic;color:#4b3b1f}
</style>
<section class="slide ph city" data-title="Physical problem: from the city to the wall" data-steps="5">
  <!-- step 0: video (assets/05-physical/urban_context3.mp4). urban_context_poster.jpg = its frame used by ?print; data-pdf-t = the time (s) of the frame used by the PDF: the city seen from above at the end -->
  <div class="vid" data-until="0"><video src="assets/05-physical/urban_context3.mp4" poster="assets/05-physical/urban_context_poster.jpg" data-pdf-t="12.5" muted loop playsinline preload="auto"></video>
    <span class="tag">urban scene simulated with Domus</span></div>

  <!-- step 1: the studied buildings (capture with the façade unit in red) -->
  <div class="vid" data-from="1" data-until="1"><img src="assets/05-physical/canyon_street_1_01Jan_15h06.png" alt="the studied buildings, façade unit in red">
    <span class="tag">studied buildings: façade unit in red</span></div>

  <!-- steps 2 to 5: the street. street_intact.jpg / street_cut.jpg are 2472 x 1144 pictures (placeholders made from canyon_street_1_01Jan_15h06_2.png):
       replace them by Domus captures of the same scene, the second with the studied building cut by a vertical plane; the corner of the building must stay at x = 892 px
       (left margin = 0), the eaves at y = 56 px and the base at y = 493 px so that the wall figure fits (see README, slide 8). -->
  <div class="st" data-from="2">
    <img src="assets/05-physical/street_intact.jpg" alt="the street, studied building on the right">
    <img class="cutL" src="assets/05-physical/street_cut.jpg" alt="">
    <img class="cutB" src="assets/05-physical/street_cut.jpg" alt="the same street, studied building cut by a vertical plane">
    <div class="pl"><i></i><u></u><b>vertical section</b></div>
  </div>
  <div class="lb ctx" style="left:130px;top:132px" data-from="2">front building</div>
  <div class="lb ctx" style="left:656px;top:400px" data-from="2">open courtyard</div>
  <div class="lb s pu" style="left:1051px;top:2px" data-from="2">studied building</div>
  <div class="lb s pu" style="left:756px;top:196px" data-from="3" data-until="3">studied wall ▶</div>

  <!-- the wall: section (steps 3 to 5), its notation (steps 4 and 5; the pills 'outside' and 'inside' are part of the drawing) -->
  <div class="wb"><div class="wsh"><div class="wsi"><svg data-include="assets/05-physical/city-wall-shapes.svg"></svg></div></div></div>
  <div class="shd"></div>
  <div class="wb nt"><svg data-include="assets/05-physical/city-wall-notes.svg"></svg></div>
  <div class="note" data-from="4">thickness<br>exaggerated</div>
  <script>
  (function(){
    const s=document.currentScript.closest('section'), v=s.querySelector('video');
    s.addEventListener('step',e=>{ if(e.detail.step===0){ v.play().catch(()=>{}); } else v.pause(); });
    s.addEventListener('leave',()=>v.pause());
    if(new URLSearchParams(location.search).has('print')) v.removeAttribute('src');
  })();
  </script>
</section>
