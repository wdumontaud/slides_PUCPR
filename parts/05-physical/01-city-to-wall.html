<!-- ================================================================ 1. urban scene -> street canyon -->
<style>
.city .vid{left:96px;top:0;width:1000px;height:562px;border-radius:12px;overflow:hidden;box-shadow:0 8px 30px rgba(0,0,0,.3);
  transform-origin:0 0;transition:transform 1s cubic-bezier(.3,.7,.2,1)}
.city .vid video,.city .vid img{width:100%;height:100%;object-fit:cover;display:block}
.city .vid .tag{position:absolute;right:14px;bottom:12px;background:rgba(0,41,75,.85);color:#fff;font-size:18px;padding:4px 12px;border-radius:6px}
.city[data-step="1"] .vid{transform:translate(-96px,0) scale(.4)}
.city .canyon{left:492px;top:-4px;width:700px;transition:opacity .8s .3s}
.city .canyon .img{position:relative;width:700px;height:520px}
.city .canyon img{position:absolute;inset:0;width:100%;height:100%}
.city .canyon svg{position:absolute;inset:0;width:100%;height:100%;font-family:inherit}
.city .canyon svg text{font-size:27px}
.city .side{left:0;top:250px;width:410px;font-size:20px;line-height:1.35}
.city .side ul{margin:0;padding-left:22px}.city .side li{margin:.35em 0}
.city .side .arrow{font-size:19px;color:var(--purple);font-weight:700;margin-bottom:8px}
</style>
<section class="slide ph city" data-title="Physical problem: from the city to the wall" data-steps="1">
  <!-- video: replace assets/05-physical/urban_context_year.webm (and its first frame assets/05-physical/urban_context_poster.jpg) by the final one -->
  <div class="vid"><video src="assets/05-physical/urban_context2.mp4" poster="assets/05-physical/urban_context_poster.jpg" muted loop playsinline preload="auto"></video>
    <span class="tag">urban scene simulated with Domus</span></div>
  <div class="side" data-from="1">
    <div class="arrow">⟶ one façade unit of the street</div>
    <ul>
      <li>studied wall of height \(H\) and thickness \(L\)</li>
      <li>front building of height \(\Delta Y\) at \(\Delta X\)</li>
      <li>boundaries \(\Gamma_1\) (outside), \(\Gamma_3\) (inside), \(\Gamma_2\), \(\Gamma_4\) (bottom, top)</li>
    </ul>
  </div>
  <figure class="canyon" data-from="1"><div class="img">
    <img src="assets/05-physical/canyon_config.jpg" alt="street canyon">
    <svg viewBox="0 0 500 780">
      <defs><marker id="ph-a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#000"/></marker>
        <marker id="ph-ay" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#e0a800"/></marker>
        <marker id="ph-ak" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#333"/></marker></defs>
    </svg></div>
    <figcaption>Street canyon configuration: the façade unit and its surroundings.</figcaption>
  </figure>
  <script>
  (function(){
    const s=document.currentScript.closest('section'), v=s.querySelector('video');
    s.addEventListener('step',e=>{ if(e.detail.step===0){ v.play().catch(()=>{}); } else v.pause(); });
    s.addEventListener('leave',()=>v.pause());
    if(new URLSearchParams(location.search).has('print')) v.removeAttribute('src');
  })();
  </script>
</section>
